<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>watch2gether</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0e;color:#ddd;font:16px system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  form{display:flex;flex-direction:column;gap:12px;width:min(320px,86vw)}
  input,button{font:inherit;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#16161d;color:#ddd}
  button{background:#2a2a40;cursor:pointer}
  #err{color:#e66;min-height:1.2em;margin:0}
</style></head>
<body>
<form method="post" action="/login">
  <h2 style="margin:0">watch2gether</h2>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <p id="err"></p>
  <button type="submit">Enter</button>
</form>
<script>const e = new URLSearchParams(location.search).get('e'); if (e) document.getElementById('err').textContent = e === '2' ? 'Your link no longer works. Ask the host for a new one.' : 'Wrong password';</script>
</body></html>
