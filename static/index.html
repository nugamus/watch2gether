<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>watch2gether</title>
<style>
  :root{--a:#c8a35a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#ddd;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit;color:#ddd;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 7px;outline:none;min-width:0}
  input:focus{border-color:#555}
  [hidden]{display:none!important}
  #app{display:flex;height:100%;height:100dvh}
  #player{position:relative;flex:1;min-width:0;background:#000;container-type:size;overflow:hidden;-webkit-user-select:none;user-select:none}
  video{position:absolute;inset:0;width:100%;height:100%;background:#000}
  aside{background:#0d0d0d;display:flex;flex-direction:column;min-height:0}
  #lib{width:280px;border-right:1px solid #1c1c1c}
  #chat{width:260px;border-left:1px solid #1c1c1c}
  .hd{display:flex;align-items:center;gap:10px;padding:7px 10px;color:#777;font-size:12px;border-bottom:1px solid #1a1a1a}
  .hd span{flex:1}
  .hd button{color:#999}.hd button:hover{color:#fff}
  .scroll{overflow-y:auto;min-height:0}
  #tree{flex:1;padding:4px 0}
  .file{padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#aaa}
  .file:hover{background:#171717;color:#fff}.file.cur{color:#fff;background:#1c1c1c}
  summary{padding:3px 10px;cursor:pointer;color:#777;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'+ ';color:#555}details[open]>summary::before{content:'\2212  '}
  .kids{padding-left:12px}
  #links{max-height:45%;padding:4px 0}
  .link{padding:5px 10px;border-bottom:1px solid #151515}
  .link .meta{color:#666;font-size:12px}
  .link button{color:#888;font-size:12px;margin-right:10px}.link button:hover{color:#fff}
  .link input{width:100%;margin:4px 0;font-size:12px}
  #newLink{display:flex;gap:4px;padding:8px 10px}
  #newLink input[name=name]{flex:1}#newLink input[name=days]{width:56px}
  #newLink button,.btn{color:#ccc;border:1px solid #2a2a2a;padding:4px 9px;border-radius:2px}
  #newLink button:hover,.btn:hover{color:#fff;border-color:#444}
  #build{color:#555;margin-left:4px}
  #modes{display:flex;flex-direction:column;gap:5px;padding:7px 10px;color:#aaa}
  #modes label{cursor:pointer}#modes input{min-width:0;margin:0 7px 0 0;vertical-align:-2px}

  #bar{position:absolute;left:0;right:0;bottom:0;padding:0 10px max(4px,env(safe-area-inset-bottom));background:rgba(0,0,0,.72);opacity:0;transition:opacity .15s;pointer-events:none}
  body.ui #bar{opacity:1;pointer-events:auto}
  body:not(.ui) #player{cursor:none}
  #seek{position:relative;height:16px;cursor:pointer;touch-action:none}
  #seek .track{position:absolute;left:0;right:0;top:7px;height:2px;background:#333;transition:height .1s,top .1s}
  #seek:hover .track,#seek.drag .track{top:6px;height:4px}
  #buf,#prog{position:absolute;left:0;top:0;bottom:0;width:0}
  #buf{background:#5a5a5a}#prog{background:var(--a)}
  #hoverT{position:absolute;bottom:17px;transform:translateX(-50%);background:#000;padding:1px 5px;font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none}
  .row{display:flex;align-items:center;height:34px}
  .row button{position:relative;width:34px;height:34px;display:grid;place-items:center;color:#bbb;flex:none}
  .row button:hover{color:#fff}
  svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  #time{font-variant-numeric:tabular-nums;color:#bbb;margin:0 8px;white-space:nowrap}
  #title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#777;text-align:center;padding:0 8px}
  #vol{-webkit-appearance:none;appearance:none;width:64px;height:16px;background:none;border:0;padding:0;margin:0 6px 0 0}
  #vol::-webkit-slider-runnable-track{height:2px;background:#555}
  #vol::-moz-range-track{height:2px;background:#555}
  #vol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-3.5px;background:#ddd;border:0;border-radius:0}
  #vol::-moz-range-thumb{width:9px;height:9px;background:#ddd;border:0;border-radius:0}
  .unread::after{content:'';position:absolute;top:8px;right:7px;width:5px;height:5px;background:var(--a)}

  #menu{position:absolute;bottom:54px;right:10px;min-width:210px;max-width:min(320px,calc(100% - 20px));max-height:calc(100% - 70px);overflow-y:auto;background:#0d0d0d;border:1px solid #262626;padding:4px 0}
  #menu .it{display:flex;gap:8px;align-items:center;padding:5px 12px;cursor:pointer;color:#bbb;white-space:nowrap}
  #menu .it:hover{background:#1a1a1a;color:#fff}
  #menu .it .d{width:10px;flex:none;color:#ddd}
  #menu .it .x{margin-left:auto;color:#666}#menu .it .x:hover{color:#fff}
  #menu .sec{padding:7px 12px 2px;color:#666;font-size:11px}
  #menu .note{padding:3px 12px;color:#666;font-size:12px}
  #menu .steps{display:flex;gap:3px;align-items:center;padding:4px 12px}
  #menu .steps button{color:#aaa;border:1px solid #2a2a2a;padding:1px 6px;border-radius:2px;font-variant-numeric:tabular-nums}
  #menu .steps button:hover{color:#fff}
  #menu .steps span{margin-left:6px;color:#ccc;font-variant-numeric:tabular-nums}
  #menu input{margin:3px 12px;width:calc(100% - 24px)}

  #tl{position:absolute;top:10px;left:12px;right:12px;color:#ddd;text-shadow:0 0 2px #000,0 0 3px #000;pointer-events:none}
  #tl button{pointer-events:auto;color:#aaa;text-decoration:underline;margin-left:8px}
  #osd{transition:opacity .2s}
  #center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#888;pointer-events:none;text-align:center;padding:20px}
  #center>*{pointer-events:auto}
  #center input{width:200px;text-align:center}
  #tap{color:#ddd;border:1px solid #444;padding:7px 16px;border-radius:2px;background:#000}

  .sub{position:absolute;left:4%;right:4%;text-align:center;pointer-events:none;line-height:1.28;color:#fff;white-space:pre-line;
       font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-weight:500;
       font-size:max(14px,calc(var(--k,1) * 4.4cqh))}
  .sub span{text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000,0 1px 3px #000}
  body.box .sub span{background:rgba(0,0,0,.66);text-shadow:none;padding:.05em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  #subB{bottom:6%}body.ui #subB{bottom:max(6%,60px)}
  #subT{top:5%;font-size:max(12px,calc(var(--k,1) * 3.6cqh))}

  #msgs{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
  #msgs b{color:#888;font-weight:500;margin-right:6px}
  #msgs .r{color:#777}
  #reacts{display:flex;gap:3px;padding:6px 8px;border-top:1px solid #1a1a1a}
  #reacts button{flex:1;padding:3px 0;color:#999;border:1px solid #222;border-radius:2px}
  #reacts button:hover{color:#fff;border-color:#444}
  #say{padding:0 8px 8px}#say input{width:100%}
  #fly{position:absolute;right:20px;bottom:70px;width:140px;height:40%;pointer-events:none}
  #fly span{position:absolute;right:0;bottom:0;color:#eee;text-shadow:0 0 3px #000;white-space:nowrap;animation:up 2s linear forwards}
  #fly small{color:#aaa;margin-left:4px}
  @keyframes up{from{transform:translateY(0)}75%{opacity:1}to{transform:translateY(-110px);opacity:0}}

  @media (pointer:coarse){.row button{width:40px;height:40px}.row{height:40px}#vol{display:none}input{font-size:16px}}
  @media (max-width:700px){#lib{position:absolute;z-index:5;top:0;bottom:0;left:0;width:86%}#title{display:none}#chat{width:220px}}
  @media (max-width:700px) and (orientation:portrait){
    #app{flex-direction:column}
    #app:has(#chat:not([hidden])) #player{flex:none;height:auto;aspect-ratio:16/9}
    #chat{width:auto;flex:1;border-left:0;border-top:1px solid #1c1c1c}
  }
  body.fs #lib,body.fs #chat{display:none!important}
</style></head>
<body class="ui">
<div id="app">
  <aside id="lib" hidden>
    <div class="hd"><span>Library <small id="build" title="Build running on the server"></small></span><button id="endBtn" type="button">End session</button><button id="libClose" type="button">Close</button></div>
    <div id="tree" class="scroll"></div>
    <div class="hd"><span>Slow connections</span></div>
    <div id="modes">
      <label title="Made once on the server and kept. Everyone still gets the original unless their connection is too slow for it; each viewer can also choose under Quality."><input type="checkbox" data-k="lite">Offer a smaller 720p copy</label>
      <label title="Wait for 10 s of video (not 3 s) before playing and keep up to 10 minutes ready"><input type="checkbox" data-k="slow">Extra buffering for distant viewers</label>
    </div>
    <div class="hd"><span>Share links</span></div>
    <div id="links" class="scroll"></div>
    <form id="newLink"><input name="name" placeholder="Name" maxlength="40" required><input name="days" inputmode="numeric" pattern="[0-9]*" placeholder="Days" title="Expires after this many days (empty = never)"><button>Create</button></form>
  </aside>
  <main id="player">
    <video id="v" playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <div id="subT" class="sub"></div><div id="subB" class="sub"></div>
    <div id="fly"></div>
    <div id="tl"><div id="stat"></div><div id="osd"></div></div>
    <div id="center"></div>
    <div id="bar">
      <div id="seek"><div class="track"><div id="buf"></div><div id="prog"></div></div><div id="hoverT" hidden></div></div>
      <div class="row">
        <button id="playBtn" type="button" title="Play (space)"></button>
        <button id="muteBtn" type="button" title="Mute (m)"></button><input id="vol" type="range" min="0" max="1" step="0.05" title="Volume">
        <span id="time">0:00 / 0:00</span>
        <span id="title"></span>
        <button id="subBtn" type="button" title="Subtitles (j, v)"></button>
        <button id="qBtn" type="button" title="Quality" hidden></button>
        <button id="audBtn" type="button" title="Audio (#)" hidden></button>
        <button id="libBtn" type="button" title="Library" hidden></button>
        <button id="chatBtn" type="button" title="Chat"></button>
        <button id="fsBtn" type="button" title="Fullscreen (f)"></button>
      </div>
    </div>
    <div id="menu" hidden></div>
  </main>
  <aside id="chat" hidden>
    <div class="hd"><span id="viewers"></span><button id="chatClose" type="button">Close</button></div>
    <div id="msgs" class="scroll"></div>
    <div id="reacts"></div>
    <form id="say"><input maxlength="500" placeholder="Message" autocomplete="off" enterkeyhint="send"></form>
  </aside>
</div>
<input id="subFile" type="file" accept=".srt,.ass,.ssa,.vtt,text/plain" hidden>
<script src="/hls.js"></script>
<script>
const $ = id => document.getElementById(id);
const v = $('v'), player = $('player'), menu = $('menu'), center = $('center');
const store = {
  get(k, d) { try { const x = localStorage.getItem('w2g-' + k); return x === null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem('w2g-' + k, JSON.stringify(x)); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

// ---- icons: 24x24 line drawings, one stroke width ----
const ICONS = {
  play: 'M7 4.5v15l12-7.5z', pause: 'M8 5v14M16 5v14',
  vol: 'M4 9.5h3.5L12 6v12l-4.5-3.5H4z M15.5 9.5a3.5 3.5 0 0 1 0 5 M18 7a7 7 0 0 1 0 10',
  mute: 'M4 9.5h3.5L12 6v12l-4.5-3.5H4z M16 10l4 4M20 10l-4 4',
  subs: 'M3.5 6h17v12h-17z M7 14.5h4M13 14.5h4M7 11.5h10',
  audio: 'M4.5 15v-3a7.5 7.5 0 0 1 15 0v3 M4.5 14.5h3v5h-3z M16.5 14.5h3v5h-3z',
  q: 'M4 7h9M17 7h3M15 5v4M4 17h3M11 17h9M9 15v4',
  lib: 'M4 6h16M4 12h16M4 18h10', chat: 'M4 5h16v11H9.5L5 19.5V16H4z',
  fs: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', unfs: 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5',
};
const icon = n => '<svg viewBox="0 0 24 24"><path d="' + ICONS[n] + '"/></svg>';
$('subBtn').innerHTML = icon('subs'); $('audBtn').innerHTML = icon('audio'); $('qBtn').innerHTML = icon('q');
$('libBtn').innerHTML = icon('lib'); $('chatBtn').innerHTML = icon('chat');

// ---- on-screen text ----
let osdTimer;
function osd(text, ms = 1600) {
  const o = $('osd'); o.textContent = text; o.style.opacity = 1;
  clearTimeout(osdTimer); osdTimer = setTimeout(() => { o.style.opacity = 0; }, ms);
}
const fmt = s => {
  if (!isFinite(s)) s = 0;
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0');
  return (h || (v.duration >= 3600) ? h + ':' + String(m).padStart(2, '0') : m) + ':' + ss;
};

// ---- room connection and strict sync ----
let localSeekAt = -1e9, remoteSeekT = null, lastSeq = -1;
let ws, last = {playing:false, t:0, at:performance.now()}, curSrc = null;
let isHost = false, media = null, room = null, connected = false, pct = null;
const expected = () => last.playing ? last.t + (performance.now()-last.at)/1000 : last.t;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function connect() {
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/ws');
  ws.onopen = () => { resetBuffering(); lastSeq = -1; connected = true; status(); };
  ws.onclose = () => {
    connected = false; status();
    // Revoked or expired link: the page itself now redirects to the login page with a note.
    fetch('/', {method: 'HEAD'}).then(r => { if (r.redirected) location.href = r.url; }).catch(() => {});
    setTimeout(connect, 1000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome') welcome(m);
    if (m.type === 'state') apply(m);
    if (m.type === 'viewers') $('viewers').textContent = m.n + ' watching';
    if (m.type === 'progress') { pct = m.pct; status(); }
    if (m.type === 'error') osd(m.msg, 7000);
    if (m.type === 'chat') addMsg(m);
    if (m.type === 'react') fly(m);
  };
}

function welcome(m) {
  isHost = m.host;
  $('build').textContent = m.build ? 'build ' + m.build : '';
  $('libBtn').hidden = !isHost;
  $('msgs').textContent = '';
  for (const c of m.chat) addMsg(c, true);
  if (isHost) { loadLib(); loadLinks(); }
  status();
}

// HLS: hls.js where it works (Firefox, Chrome); Safari's own player where Safari can switch audio
// tracks itself (iPad, Mac) or hls.js can't run (older iPhones).
let hls = null;
const nativeHls = () => v.canPlayType('application/vnd.apple.mpegurl') && (v.audioTracks || !window.Hls?.isSupported());
const bufCfg = () => mode.slow ? {maxBufferLength: 600, maxMaxBufferLength: 900, maxBufferSize: 300e6}
                               : {maxBufferLength: 60, maxMaxBufferLength: 180, maxBufferSize: 60e6};
function load(src) {
  if (hls) { hls.destroy(); hls = null; }
  if (!src) { v.removeAttribute('src'); v.load(); return; }
  if (src.endsWith('.m3u8') && !nativeHls()) {
    hls = new Hls(bufCfg());
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) send({type:'failed', msg: d.details}); });
    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, audioReady);
    hls.on(Hls.Events.MANIFEST_PARSED, applyQuality);
    hls.loadSource(src); hls.attachMedia(v);
  } else v.src = src;
}
v.addEventListener('error', () => { if (curSrc && v.error) send({type:'failed', msg: 'decode error ' + v.error.code + ' ' + (v.error.message || '')}); });

function apply(m) {
  room = m;
  if (m.mode) {
    mode = m.mode;
    if (hls) Object.assign(hls.config, bufCfg());
    for (const i of document.querySelectorAll('#modes input')) i.checked = !!mode[i.dataset.k];
  }
  if (m.preparing === null) pct = null;
  const src = m.media ? m.media.src : null;
  if (src !== curSrc) {
    curSrc = src; resetBuffering(); load(src);
    media = m.media; mediaChanged();
  } else if (m.media) { media = m.media; subsChanged(); }
  $('qBtn').hidden = !(media && media.lite);
  // 'forced' = someone deliberately moved the position (seek / new video); anything else is just the room pausing for a stall.
  const forced = m.seq !== lastSeq; lastSeq = m.seq;
  if (forced) { clearTimeout(bufTimer); reported = true; } // the server now waits for our confirmation
  // Don't move a viewer who is mid-seek of their own, or who is buffering and merely catching up
  // (a forward seek into data they don't have yet would stall them even more).
  const mid = v.seeking || performance.now() - localSeekAt < 1500 || (reported && !forced);
  last = {playing:m.playing, t: mid ? v.currentTime : m.t, at:performance.now()};
  if (!mid && Math.abs(v.currentTime - m.t) > 0.6) { remoteSeekT = m.t; v.currentTime = m.t; }
  if (m.playing && v.paused) {
    v.play().catch(e => { if (e.name === 'NotAllowedError') { needTap = true; status(); } });
  }
  if (!m.playing && !v.paused) v.pause();
  status();
  markCurrent();
}

// Events are only sent when they differ from the last known shared state,
// so applying remote updates never echoes back.
v.addEventListener('play',  () => { if (!last.playing) send({type:'play',  t:v.currentTime}); });
v.addEventListener('pause', () => { if (last.playing)  send({type:'pause', t:v.currentTime}); });
// Send on 'seeking' (not 'seeked') and remember it: on slow links a stale server update can arrive
// mid-seek and would otherwise yank the video back.
v.addEventListener('seeking', () => {
  if (remoteSeekT !== null && Math.abs(v.currentTime - remoteSeekT) < 0.25) { remoteSeekT = null; return; } // our own apply()
  remoteSeekT = null;
  localSeekAt = performance.now();
  last = {playing:last.playing, t:v.currentTime, at:performance.now()};
  send({type:'seek', t:v.currentTime});
});
// Strict sync: the room only plays while every viewer is ready, and freezes for anyone who isn't.
//  - while the room is playing, a stall (>700ms) reports "buffering" and everyone pauses;
//  - while the room is paused, a viewer without enough buffered video also reports "buffering",
//    so pressing play waits for them instead of starting without them.
// "ready" = enough seconds buffered ahead. That threshold doubles if this viewer stalls again soon
// after (3s -> 6s -> ... -> 30s), so a slow link pauses less often but for longer.
let bufTimer = null, reported = false, needSecs = 3, lastStall = 0;
function aheadSecs() {
  const b = v.buffered;
  for (let i = 0; i < b.length; i++) if (v.currentTime >= b.start(i) - 0.1 && v.currentTime <= b.end(i)) return b.end(i) - v.currentTime;
  return 0;
}
function isReady() {
  const left = (v.duration || Infinity) - v.currentTime;
  const need = Math.min(Math.max(needSecs, mode.slow ? 10 : 3), Math.max(0.5, left - 0.2));
  const ahead = aheadSecs();
  // readyState 4 = the browser itself predicts uninterrupted playback (helps where paused videos buffer
  // little, e.g. iOS). Too optimistic on a slow, distant link, so "Bigger buffers" ignores it.
  return v.readyState >= 2 && (ahead >= need || (!mode.slow && v.readyState >= 4));
}
function resetBuffering() { clearTimeout(bufTimer); reported = false; }
function reportReady(t = v.currentTime) { if (!reported) return; resetBuffering(); send({type:'ready', t, seq:lastSeq}); }
function reportBuffering(why) {
  if (reported) return;
  const now = performance.now();
  needSecs = now - lastStall < 30000 ? Math.min(needSecs * 2, mode.slow ? 60 : 30) : (mode.slow ? 10 : 3);
  lastStall = now;
  reported = true;
  send({type: 'buffering', why: why + ' rs=' + v.readyState + ' ahead=' + aheadSecs().toFixed(1) + 's need=' + needSecs + 's' + (v.paused ? ' paused' : '') + (document.hidden ? ' hidden' : '') + (needTap ? ' needs-tap' : '')});
}
v.addEventListener('waiting', () => {
  if (!last.playing || reported || document.hidden) return;
  clearTimeout(bufTimer);
  bufTimer = setTimeout(() => { if (v.readyState < 3) reportBuffering('stalled'); }, 700);
});
for (const e of ['playing', 'canplay']) v.addEventListener(e, () => clearTimeout(bufTimer));
setInterval(() => {
  if (!ws || ws.readyState !== 1) return;
  if (!curSrc) { reportReady(); return; } // nothing to load, so nothing to wait for
  // A background tab (switched away, phone locked) isn't watching: never hold the room for it, and
  // confirm at the room's position, not its own stale one (that would pull everyone back).
  if (document.hidden) { if (reported) reportReady(expected()); return; }
  const ok = isReady();
  if (reported) { if (ok) reportReady(); }
  else if (!last.playing && !ok) reportBuffering('not enough buffered');
}, 200);
// Mobile browsers block play() without a gesture; the "Tap to join" button supplies one.
let needTap = false;
function join() { needTap = false; status(); if (last.playing) { v.currentTime = expected(); v.play().catch(() => { needTap = true; status(); }); } }
v.addEventListener('playing', () => { if (needTap) { needTap = false; status(); } });

let mode = {lite: false, slow: false};
// ---- quality: Auto lets the player choose by connection speed ----
let quality = store.get('quality', 'auto');
function applyQuality() {
  if (!hls || !hls.levels || !hls.levels.length) return;
  hls.currentLevel = quality === 'auto' ? -1 : hls.levels.findIndex(l => String(l.url).includes('/lite/') === (quality === 'lite'));
}
const QUALITIES = [['auto', 'Auto (recommended)'], ['orig', 'Original'], ['lite', 'Smaller, for slow connections (720p)']];
$('qBtn').onclick = () => openMenu($('qBtn'), m => {
  m.append(sec('Quality'));
  for (const [k, label] of QUALITIES) m.append(item(label, quality === k, () => {

  }));

for (const i of document.querySelectorAll('#modes input')) i.onchange = () => {
  const m = {}; for (const x of document.querySelectorAll('#modes input')) m[x.dataset.k] = x.checked;
  send({type: 'mode', ...m});

// ---- status: top-left line and centre ----
function status() {

  else if (room && room.waiting.length) {
    st.innerHTML = 'Waiting for ' + esc(room.waiting.join(', ')) + ' to buffer…<button type="button" id="force">Resume anyway</button>';
    $('force').onclick = () => send({type:'force'});
  } else st.textContent = '';
  const c = [];
  if (room && room.preparing) c.push('Preparing ' + esc(room.preparing) + (pct !== null ? ' ' + pct + '%' : '…'));
  else if (room && !room.media) c.push(isHost ? 'Nothing playing' : 'Waiting for the host');
  if (needTap) c.push('<button id="tap" type="button">Tap to join</button>');
  center.innerHTML = c.join('<br>');
  if (needTap) $('tap').onclick = join;
  $('title').textContent = media ? media.title : '';
  document.title = media ? media.title : 'watch2gether';
}

// ---- controls ----
let hideTimer, overBar = false;
function poke() {
  document.body.classList.add('ui');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (menu.hidden && !overBar && !seekDrag) document.body.classList.remove('ui'); }, 2000);
}
player.addEventListener('mousemove', poke);
$('bar').addEventListener('mouseenter', () => { overBar = true; });
$('bar').addEventListener('mouseleave', () => { overBar = false; poke(); });
// Mouse: click toggles play, double-click fullscreen. Touch: tap shows or hides the controls.
player.addEventListener('pointerup', e => {
  if (e.target !== v && e.target !== center) return;
  if (!menu.hidden) { closeMenu(); return; }
  if (e.pointerType === 'mouse') togglePlay();
  else if (document.body.classList.contains('ui')) { clearTimeout(hideTimer); document.body.classList.remove('ui'); }
  else poke();
});
v.addEventListener('dblclick', toggleFs);
function togglePlay() { if (!curSrc) return; if (v.paused) v.play().catch(() => {}); else v.pause(); }
$('playBtn').onclick = togglePlay;
const syncPlay = () => { $('playBtn').innerHTML = icon(v.paused ? 'play' : 'pause'); };
v.addEventListener('play', syncPlay); v.addEventListener('pause', syncPlay); syncPlay();

v.volume = store.get('vol', 1); $('vol').value = v.volume;
$('vol').oninput = () => { v.volume = +$('vol').value; v.muted = false; };
$('muteBtn').onclick = () => { v.muted = !v.muted; };
v.addEventListener('volumechange', () => {
  $('muteBtn').innerHTML = icon(v.muted || v.volume === 0 ? 'mute' : 'vol');
  $('vol').value = v.muted ? 0 : v.volume; store.set('vol', v.volume);
});
$('muteBtn').innerHTML = icon('vol');

const seek = $('seek');
let seekDrag = null;
const frac = e => { const r = seek.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
function showHover(e) {
  if (!v.duration) return;
  const f = frac(e), h = $('hoverT');
  h.hidden = false; h.textContent = fmt(f * v.duration);
  h.style.left = Math.min(Math.max(f * seek.clientWidth, 24), seek.clientWidth - 24) + 'px';
}
seek.addEventListener('pointermove', e => { showHover(e); if (seekDrag !== null) { seekDrag = frac(e); drawProgress(); } });
seek.addEventListener('pointerleave', () => { if (seekDrag === null) $('hoverT').hidden = true; });
seek.addEventListener('pointerdown', e => { if (!v.duration) return; seek.setPointerCapture(e.pointerId); seek.classList.add('drag'); seekDrag = frac(e); showHover(e); drawProgress(); });
seek.addEventListener('pointerup', e => {
  if (seekDrag === null) return;
  v.currentTime = frac(e) * v.duration;   // seek once, on release: every seek makes the room wait for everyone
  seekDrag = null; seek.classList.remove('drag'); $('hoverT').hidden = true; poke();
});
function drawProgress() {
  const d = v.duration || 0, t = seekDrag !== null ? seekDrag * d : v.currentTime;
  $('prog').style.width = d ? (t / d * 100) + '%' : 0;
  let end = 0;
  for (let i = 0; i < v.buffered.length; i++) if (v.buffered.start(i) <= v.currentTime + 1) end = Math.max(end, v.buffered.end(i));
  $('buf').style.width = d ? (end / d * 100) + '%' : 0;
  $('time').textContent = fmt(t) + ' / ' + fmt(d);
}
for (const e of ['timeupdate', 'progress', 'durationchange', 'emptied']) v.addEventListener(e, drawProgress);

const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFs() {
  const d = document.documentElement;
  if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (d.requestFullscreen) d.requestFullscreen().catch(() => {});
  else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
  else { document.body.classList.toggle('fs'); syncFs(); } // iPhone: no element fullscreen, so hide the side panels instead
}
const syncFs = () => { $('fsBtn').innerHTML = icon(fsElement() || document.body.classList.contains('fs') ? 'unfs' : 'fs'); };
document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs); syncFs();
$('fsBtn').onclick = toggleFs;

// ---- menus: one dark list above the bar ----
let menuFor = null;
function openMenu(btn, build) {
  if (menuFor === btn && !menu.hidden) { closeMenu(); return; }
  menuFor = btn; menu.innerHTML = ''; build(menu); menu.hidden = false; poke();
}
function closeMenu() { menu.hidden = true; menuFor = null; poke(); }
function item(label, on, act, extra) {
  const d = document.createElement('div'); d.className = 'it';
  d.innerHTML = '<span class="d">' + (on ? '●' : '') + '</span><span>' + esc(label) + '</span>';
  d.onclick = e => { e.stopPropagation(); act(); };
  if (extra) d.append(extra);
  return d;
}
function sec(text) { const d = document.createElement('div'); d.className = 'sec'; d.textContent = text; return d; }
document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && !e.target.closest('.row button')) closeMenu(); });

// ---- subtitles: rendered by the page, so two tracks, the delay and the style work everywhere ----
let subPref = store.get('subs', {p: null, s: null, on: true, size: 1, box: false});
let sel = {p: null, s: null};
const cueCache = new Map();
const subKey = s => s.lang || s.name;
const SIZES = [0.75, 1, 1.25, 1.55];
function applySubStyle() {
  document.body.style.setProperty('--k', SIZES[subPref.size] ?? 1);
  document.body.classList.toggle('box', !!subPref.box);
}
applySubStyle();
function parseVtt(txt) {
  const ts = s => s.trim().split(':').reduce((a, x) => a * 60 + Number(x), 0);
  const html = t => esc(t).replace(/&lt;(\/?[ibu])&gt;/g, '<$1>').replace(/&lt;[^&]*&gt;/g, '');
  const cues = [];
  for (const block of txt.replace(/\r/g, '').split(/\n\n+/)) {
    const lines = block.split('\n'), i = lines.findIndex(l => l.includes('-->'));
    if (i < 0) continue;
    const [a, b] = lines[i].split('-->');
    cues.push({s: ts(a), e: ts(b.trim().split(/\s+/)[0]), h: html(lines.slice(i + 1).join('\n'))});
  }
  return cues.sort((x, y) => x.s - y.s);
}
async function cuesOf(id) {
  const s = media && media.subs.find(x => x.id === id);
  if (!s) return null;
  if (!cueCache.has(s.src)) cueCache.set(s.src, fetch(s.src).then(r => r.text()).then(parseVtt).catch(() => []));
  return cueCache.get(s.src);
}
let cues = {p: null, s: null};
async function choose(slot, id, remember = true) {
  sel[slot] = id; cues[slot] = null;
  if (remember) { const s = media.subs.find(x => x.id === id); subPref[slot] = s ? subKey(s) : null; store.set('subs', subPref); }
  if (id) { const c = await cuesOf(id); if (sel[slot] === id) cues[slot] = c; }
}
function mediaChanged() {
  cueCache.clear(); sel = {p: null, s: null}; cues = {p: null, s: null};
  audioPrefApplied = false; $('audBtn').hidden = true;
  subsChanged();
  status();
}
// Pick each viewer's remembered languages when a video (or a new subtitle) appears.
function subsChanged() {
  if (!media) return;
  for (const slot of ['p', 's']) {
    if (sel[slot] && !media.subs.some(s => s.id === sel[slot])) choose(slot, null, false);
    if (!sel[slot] && subPref[slot]) {
      const s = media.subs.find(x => subKey(x) === subPref[slot] && x.id !== sel[slot === 'p' ? 's' : 'p']);
      if (s) choose(slot, s.id, false);
    }
  }
}
function renderSubs() {
  const off = room ? room.offset : 0, t = v.currentTime - off;
  for (const [el, slot] of [[$('subB'), 'p'], [$('subT'), 's']]) {
    const list = subPref.on && cues[slot];
    const h = list ? list.filter(c => c.s <= t && t < c.e).map(c => c.h).join('\n') : '';
    if (el._h !== h) { el._h = h; el.innerHTML = h ? '<span>' + h + '</span>' : ''; }
  }
  requestAnimationFrame(renderSubs);
}
requestAnimationFrame(renderSubs);
function nudge(d) {
  if (!isHost) { osd('Only the host can change the subtitle delay'); return; }
  const nv = Math.round(((room ? room.offset : 0) + d) * 10) / 10;
  send({type:'offset', v: nv}); osd('Subtitle delay ' + (nv > 0 ? '+' : '') + nv.toFixed(1) + ' s');
}
function cyclePrimary() {
  if (!media || !media.subs.length) { osd('No subtitles'); return; }
  const ids = [null, ...media.subs.map(s => s.id)];
  const next = ids[(ids.indexOf(sel.p) + 1) % ids.length];
  choose('p', next); subPref.on = true; store.set('subs', subPref);
  osd('Subtitles: ' + (next ? media.subs.find(s => s.id === next).name : 'off'));
}
async function addSub(form) {
  osd('Adding subtitles…', 15000);
  const r = await fetch('/api/subs', {method: 'POST', body: form});
  osd(r.ok ? 'Subtitles added' : await r.text(), r.ok ? 1600 : 6000);
}
$('subFile').onchange = () => {
  const f = $('subFile').files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f); addSub(fd); $('subFile').value = '';
};
function subMenu(m) {
  const subs = media ? media.subs : [];
  const list = slot => {
    m.append(item('Off', !sel[slot], () => { choose(slot, null); subMenu(clear(m)); }));
    for (const s of subs) {
      let x = null;
      if (isHost && s.id[0] === 'u') {
        x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'Remove';
        x.onclick = e => { e.stopPropagation(); send({type:'subremove', id: s.id}); closeMenu(); };
      }
      m.append(item(s.name, sel[slot] === s.id, () => { choose(slot, s.id); subPref.on = true; store.set('subs', subPref); subMenu(clear(m)); }, x));
    }
  };
  m.append(sec('Subtitles')); list('p');
  if (subs.length > 1) { m.append(sec('Second line (top)')); list('s'); }
  for (const s of (media ? media.skipped : [])) { const n = document.createElement('div'); n.className = 'note'; n.textContent = 'Not shown: ' + s + ', image subtitles'; m.append(n); }
  m.append(sec('Style'));
  m.append(item('Size: ' + ['small', 'medium', 'large', 'huge'][subPref.size], false, () => { subPref.size = (subPref.size + 1) % 4; store.set('subs', subPref); applySubStyle(); subMenu(clear(m)); }));
  m.append(item('Background: ' + (subPref.box ? 'box' : 'outline'), false, () => { subPref.box = !subPref.box; store.set('subs', subPref); applySubStyle(); subMenu(clear(m)); }));
  const off = room ? room.offset : 0;
  m.append(sec('Delay (everyone)'));
  const st = document.createElement('div'); st.className = 'steps';
  if (isHost) for (const d of [-1, -0.1, 0.1, 1]) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = (d > 0 ? '+' : '−') + Math.abs(d);
    b.onclick = e => { e.stopPropagation(); nudge(d); setTimeout(() => menu.hidden || subMenu(clear(m)), 300); };
    st.append(b);
  }
  const val = document.createElement('span'); val.textContent = (off > 0 ? '+' : '') + off.toFixed(1) + ' s'; st.append(val);
  m.append(st);
  if (isHost && media) {
    m.append(sec('Add'));
    m.append(item('Upload file…', false, () => { $('subFile').click(); closeMenu(); }));
    const u = document.createElement('input'); u.placeholder = 'or paste a link and press Enter'; u.type = 'url';
    u.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter' && u.value.trim()) { const fd = new FormData(); fd.append('url', u.value.trim()); addSub(fd); closeMenu(); } };
    m.append(u);
  }
}
const clear = m => { m.innerHTML = ''; return m; };
$('subBtn').onclick = () => openMenu($('subBtn'), subMenu);

// ---- audio tracks (HLS renditions): hls.js, or Safari's own audioTracks ----
let audioPrefApplied = false;
function audioList() {
  if (hls) return hls.audioTracks.map((t, i) => ({i, name: t.name || t.lang || 'Track ' + (i + 1), lang: t.lang, on: hls.audioTrack === i}));
  const a = v.audioTracks; if (!a) return [];
  return Array.from(a, (t, i) => ({i, name: t.label || t.language || 'Track ' + (i + 1), lang: t.language, on: t.enabled}));
}
function setAudio(i, remember = true) {
  if (hls) hls.audioTrack = i;
  else if (v.audioTracks) for (let k = 0; k < v.audioTracks.length; k++) v.audioTracks[k].enabled = k === i;
  const t = audioList()[i];
  if (t && remember) { store.set('audio', t.lang || t.name); osd('Audio: ' + t.name); }
}
function audioReady() {
  const list = audioList();
  $('audBtn').hidden = list.length < 2;
  if (audioPrefApplied || !list.length) return;
  audioPrefApplied = true;
  const want = store.get('audio', null), t = list.find(x => (x.lang || x.name) === want);
  if (t && !t.on) setAudio(t.i, false);
}
if (v.audioTracks) v.audioTracks.addEventListener?.('addtrack', audioReady);
v.addEventListener('loadedmetadata', audioReady);
function cycleAudio() {
  const l = audioList(); if (l.length < 2) { osd('Only one audio track'); return; }
  const cur = l.findIndex(t => t.on); setAudio((cur + 1) % l.length);
}
$('audBtn').onclick = () => openMenu($('audBtn'), m => {
  m.append(sec('Audio'));
  for (const t of audioList()) m.append(item(t.name, t.on, () => { setAudio(t.i); closeMenu(); }));
});

// ---- host: library, sessions, share links ----
const lib = $('lib');
function showLib(on) { lib.hidden = !on; }
$('libBtn').onclick = () => showLib(lib.hidden);
$('libClose').onclick = () => showLib(false);
$('endBtn').onclick = () => { if (confirm('End the session? Guests will wait for the next one.')) send({type:'end'}); };
let files = [];
async function loadLib() {
  const r = await fetch('/api/files'); if (!r.ok) return;
  files = await r.json(); renderLib();
  if (!media) showLib(true);
}
function renderLib() {
  const tree = {};
  for (const f of files) {
    let n = tree;
    const parts = f.path.split('/');
    for (const p of parts.slice(0, -1)) n = n[p] ??= {};
    (n[''] ??= []).push([parts.at(-1), f]);
  }
  const build = (n, parent) => {
    for (const k of Object.keys(n).filter(k => k).sort()) {
      const d = document.createElement('details'), s = document.createElement('summary'), inner = document.createElement('div');
      s.textContent = k; inner.className = 'kids'; d.append(s, inner);
      build(n[k], inner); d.open = !!inner.querySelector('.cur'); parent.append(d);
    }
    for (const [label, f] of (n[''] || []).sort((a, b) => a[0].localeCompare(b[0]))) {
      const d = document.createElement('div');
      d.textContent = label; d.title = f.path; d.dataset.vid = f.vid;
      d.className = 'file' + (media && f.vid === media.vid ? ' cur' : '');
      d.onclick = () => { send({type:'select', path: f.path}); if (matchMedia('(max-width:700px)').matches) showLib(false); };
      parent.append(d);
    }
  };
  const t = $('tree'); t.innerHTML = ''; build(tree, t);
  if (!files.length) t.innerHTML = '<div class="file">No videos found</div>';
}
const markCurrent = () => { for (const d of document.querySelectorAll('.file')) d.classList.toggle('cur', !!media && d.dataset.vid === media.vid); };
const day = s => new Date(s * 1000).toISOString().slice(0, 10);
let fresh = {};  // link id -> full URL, only known right after creating / regenerating
async function loadLinks() {
  const r = await fetch('/api/links'); if (!r.ok) return;
  const box = $('links'); box.innerHTML = '';
  for (const l of await r.json()) {
    const d = document.createElement('div'); d.className = 'link';
    d.innerHTML = '<div>' + esc(l.name) + '</div><div class="meta">' + (l.expires ? 'until ' + day(l.expires) : 'no expiry') + '</div>';
    if (fresh[l.id]) {
      const i = document.createElement('input'); i.readOnly = true; i.value = fresh[l.id]; i.onclick = () => i.select();
      const c = document.createElement('button'); c.type = 'button'; c.textContent = 'Copy';
      c.onclick = () => { i.select(); (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(() => osd('Link copied'), () => document.execCommand('copy')); };
      d.append(i, c);
    }
    const regen = document.createElement('button'); regen.type = 'button'; regen.textContent = 'New link';
    regen.title = 'Replace this link with a new one; the old one stops working';
    regen.onclick = async () => {
      if (!confirm('Make a new link for ' + l.name + '? The old link stops working.')) return;
      const x = await (await fetch('/api/links/' + l.id + '/regenerate', {method: 'POST'})).json();
      fresh[l.id] = location.origin + x.path; loadLinks();
    };
    const rev = document.createElement('button'); rev.type = 'button'; rev.textContent = 'Revoke';
    rev.onclick = async () => { if (confirm('Revoke ' + l.name + '? Whoever has it is disconnected.')) { await fetch('/api/links/' + l.id, {method: 'DELETE'}); loadLinks(); } };
    d.append(regen, rev);
    box.append(d);
  }
}
$('newLink').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, days = parseInt(f.days.value, 10);
  const r = await fetch('/api/links', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({name: f.name.value, days: days > 0 ? days : null})});
  const x = await r.json(); fresh[x.id] = location.origin + x.path; f.reset(); loadLinks();
};

// ---- chat and reactions ----
const chat = $('chat');
let chatOpen = store.get('chat', false);
function showChat(on) { chatOpen = on; chat.hidden = !on; store.set('chat', on); if (on) $('chatBtn').classList.remove('unread'); }
showChat(chatOpen);
$('chatBtn').onclick = () => showChat(chat.hidden);
$('chatClose').onclick = () => showChat(false);
function addMsg(m, old) {
  const box = $('msgs'), d = document.createElement('div');

  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;

$('say').onsubmit = e => {
  e.preventDefault(); const i = e.target.firstElementChild;
  if (i.value.trim()) send({type:'chat', text: i.value}); i.value = '';
};
for (const r of ['♥', 'ha', 'wow', '!', '?', 'zzz']) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = r;
  b.onclick = () => send({type:'react', r}); $('reacts').append(b);
}
function fly(m) {

  s.style.right = Math.floor(Math.random() * 60) + 'px';
  $('fly').append(s); setTimeout(() => s.remove(), 2100);
}

// ---- keyboard: mpv bindings ----
document.addEventListener('keydown', e => {
  if (e.target.closest('input') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, done = () => { e.preventDefault(); poke(); };
  if (k === ' ' || k === 'k') { togglePlay(); done(); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { if (v.duration) { v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + (k === 'ArrowLeft' ? -5 : 5))); osd(fmt(v.currentTime) + ' / ' + fmt(v.duration)); } done(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') { v.muted = false; v.volume = Math.max(0, Math.min(1, Math.round((v.volume + (k === 'ArrowUp' ? 0.05 : -0.05)) * 100) / 100)); osd('Volume ' + Math.round(v.volume * 100) + '%'); done(); }
  else if (k === 'f') { toggleFs(); done(); }
  else if (k === 'm') { v.muted = !v.muted; osd(v.muted ? 'Mute' : 'Unmute'); done(); }
  else if (k === 'j') { cyclePrimary(); done(); }
  else if (k === 'v') { subPref.on = !subPref.on; store.set('subs', subPref); osd('Subtitles ' + (subPref.on ? 'visible' : 'hidden')); done(); }
  else if (k === '#') { cycleAudio(); done(); }
  else if (k === 'z') { nudge(-0.1); done(); }
  else if (k === 'x') { nudge(0.1); done(); }
  else if (k === 'Escape') { if (!menu.hidden) closeMenu(); else if (document.body.classList.contains('fs')) toggleFs(); }
});

poke();
connect();
status();
</script>
