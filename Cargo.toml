[package]
name = "watch2gether"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stasnocap/watch2gether"
description = "Watch local videos together over the internet, in strict sync"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
