[package]
name = "watch2gether"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stasnocap/watch2gether"
description = "Watch local videos together over the internet, in strict sync"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6"
getrandom = "0.3"
base64 = "0.22"
chardetng = "1.0"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
