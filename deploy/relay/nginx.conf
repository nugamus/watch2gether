# watch2gether relay: viewers in East Asia connect here (Tokyo); it forwards to the home server
# and keeps video it has fetched, so seeks and later viewers don't cross to Europe again.
proxy_cache_path /var/cache/nginx/w2g levels=1:2 keys_zone=w2g:50m max_size=25g inactive=3d use_temp_path=off;

upstream home {
    server stream.nugamus.quest:443;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name streamcn.nugamus.quest;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name streamcn.nugamus.quest;
    ssl_certificate     /etc/letsencrypt/live/streamcn.nugamus.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamcn.nugamus.quest/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name stream.nugamus.quest;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Note: a location that sets any proxy_set_header drops all of these, so /m/ repeats them.
    proxy_set_header Host stream.nugamus.quest;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 20 MB of random bytes for measuring viewer -> relay speed (e.g. from China test sites).
    location = /speedtest.bin { root /var/www/html; }

    location / {
        proxy_pass https://home;
    }

    location /ws {
        proxy_buffering off;
        proxy_pass https://home;
    }

    # Video: cached in 4 MB slices keyed by the (secret, per-video) URL. The origin marks media
    # private for browsers; this cache only ever hands it to people who have the URL.
    location /m/ {
        slice 4m;
        proxy_set_header Host stream.nugamus.quest;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Range $slice_range;
        proxy_cache w2g;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 1d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        add_header X-Relay-Cache $upstream_cache_status always;
        proxy_pass https://home;
    }
}
